services:
    api:
        image: youngmarco/melodies-merch-store-api:latest
        restart: unless-stopped
        env_file:
            - .env
        environment:
            DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
            REDIS_HOST: redis
            REDIS_PORT: 6379
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
            - app-network

    frontend:
        image: youngmarco/melodies-merch-store-fe:latest
        restart: unless-stopped
        networks:
            - app-network

    nginx:
        image: nginx:alpine
        restart: unless-stopped
        ports:
            - '127.0.0.1:8081:80'
        volumes:
            - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - api
            - frontend
        networks:
            - app-network

    db:
        image: postgres:16-alpine
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
            interval: 5s
            timeout: 5s
            retries: 12
        networks:
            - app-network

    redis:
        image: redis:7-alpine
        restart: unless-stopped
        environment:
            REDIS_PASSWORD: ${REDIS_PASSWORD}
        command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
        volumes:
            - redis_data:/data
        healthcheck:
            test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG']
            interval: 5s
            timeout: 5s
            retries: 12
        networks:
            - app-network

volumes:
    postgres_data:
    redis_data:

networks:
    app-network:
        driver: bridge
